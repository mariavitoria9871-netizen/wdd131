<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Yamaha Brasil</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <h1>Yamaha Brasil</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="modelos.html">Modelos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contato">
            <h2>Entre em Contato</h2>
            <p>Preencha o formulário abaixo para enviar sua mensagem.</p>

            <form id="formContato">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="modelo">Modelo Yamaha de interesse:</label>
                <select id="modelo" name="modelo" required>
                    <option value="">Selecione um modelo</option>
                    <option value="FZ15">Yamaha FZ15</option>
                    <option value="FZ25">Fazer FZ25</option>
                    <option value="MT-03">MT-03</option>
                    <option value="Lander 250">Lander 250</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                <button type="submit">Enviar mensagem</button>
            </form>

            <p id="resultado"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto Final WDD131 - Yamaha</p>
    </footer>

    <script src="scripts/script.js"></script>
</body>

</html>
